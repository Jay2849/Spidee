<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
	<meta name="description" content="Spidee - Action Game in HTML5, CSS3 and Javascript" />
	<title>Spidee</title>
	<link rel="shortcut icon" href="images/spider-head.png" />
	<link rel="stylesheet" href="css/spiderman-game.css" />
</head>
<style type="text/css">
	html,
	body {
		height: 100%;
		width: 100%;
		margin: 0;
		padding: 0;
		font-size: 0;
		background: #0a0e1a;
		overflow: hidden;
		touch-action: none;
		-webkit-touch-callout: none;
		-webkit-user-select: none;
		user-select: none;
	}

	.canvas-wrapper {
		position: absolute;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);
		width: 95vw;
		max-width: 1111px;
		display: flex;
		flex-direction: column;
		align-items: center;
		box-sizing: border-box;
	}

	.canvas-container {
		position: relative;
		width: 100%;
		min-height: 260px;
		display: flex;
		justify-content: center;
		align-items: center;
	}

	.game-title {
		width: 100%;
		text-align: center;
		font-size: 36px;
		color: #e62429;
		font-family: SpidermanGamePixelFont, Helvetica, Arial;
		margin-bottom: 8px;
		text-transform: uppercase;
		letter-spacing: 3px;
		text-shadow: 0 0 12px rgba(230, 36, 41, 0.6), 2px 2px 4px rgba(0, 0, 0, 0.8);
	}

	.key {
	    height: 32px;
	    min-width: 25px;
	    line-height: 32px;
	    text-align: center;
	    border: 1px solid #444;
	    border-bottom: 3px solid #222;
	    background: #1e293b;
	    display: inline-block;
	    padding: 0 6px;
	    border-radius: 6px;
	    box-shadow: inset 0 -1px 0 #111;
	    color: #f1f5f9;
	    font-weight: bold;
	    font-size: 13px;
	}

	.key.spacebar {
		padding: 0 25px;
	}

	.keyboard {
		margin: 0 0 10px 0;
		font-size: 14px;
	    font-family: Helvetica, Arial, sans-serif;
	    color: #cbd5e1;
	    text-align: center;
	}

	.action {
		margin-right: 12px;
		color: #94a3b8;
	}

	#canvas {
		width: 100% !important;
		height: auto !important;
		aspect-ratio: 1111 / 500;
		max-height: 65vh;
		border-radius: 8px;
		box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(230, 36, 41, 0.2);
		touch-action: none;
		background: #0a0e1a;
	}

	@media (max-width: 768px) {
		.keyboard {
			display: none !important;
		}
		.game-title {
			font-size: 24px;
			margin-bottom: 4px;
		}
		#canvas {
			max-height: 58vh;
		}
	}
</style>
<body>
	<div class="canvas-wrapper">
		<div class="canvas-container" id="canvasContainer">
			<canvas id="canvas" width="1111" height="500"></canvas>
		</div>
	</div>
</body>
<script type="text/javascript" src="spiderman-game.js?v=1770969000"></script>
<script type="text/javascript">
function initSpideeGame() {
	var game = new SpidermanGame({
		canvas: "#canvas"
	});
	game.load();
	window.spideeGame = game;

	// Make UI Keyboard Hint badges clickable for instant restart/pause/shoot controls
	var keys = document.querySelectorAll(".keyboard .key, .keyboard .action");
	for (var i = 0; i < keys.length; i++) {
		(function(el) {
			el.style.cursor = "pointer";
			el.addEventListener("click", function() {
				var txt = (el.innerText || el.textContent || "").toUpperCase();
				if (txt.indexOf("ENTER") > -1 || txt.indexOf("RESTART") > -1) {
					game.restart();
				} else if (txt.indexOf("ESC") > -1 || txt.indexOf("PAUSE") > -1) {
					if (game.paused) game.unpause(); else game.pause();
				} else if (txt.indexOf("SPACE") > -1 || txt.indexOf("SHOOT") > -1) {
					game.spiderman.keydown(32);
					setTimeout(function() { game.spiderman.keyup(32); }, 120);
				} else if (txt.indexOf("SHIFT") > -1 || txt.indexOf("RAGE") > -1) {
					if (game.spiderman.rageMeter >= 100 && game.spiderman.rageTimer <= 0) {
						game.spiderman.activateRage();
					}
				}
			});
		})(keys[i]);
	}
}

if (document.readyState === "complete" || document.readyState === "interactive") {
	initSpideeGame();
} else {
	window.addEventListener("DOMContentLoaded", initSpideeGame);
}
</script>
</html>
